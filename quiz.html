<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Skill Assessment Quiz - LearnTube.ai">
    <title>Quiz - LearnTube.ai</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/quiz.css">

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="learntubelogo.webp">
</head>

<body>
    <!-- Top App Bar -->
    <header class="header"
        style="position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--background-dark); border-bottom: 1px solid rgba(49, 104, 99, 0.3);">
        <div
            style="max-width: 28rem; margin: 0 auto; padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <img src="learntubelogo.webp" alt="LearnTube Logo"
                    style="width: 28px; height: 28px; border-radius: 6px;">
                <span style="font-weight: 700; font-size: 1.125rem; color: white;">LearnTube.ai</span>
            </div>
            <div
                style="display: flex; align-items: center; gap: 0.375rem; background: rgba(255,255,255,0.1); padding: 0.25rem 0.625rem; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.1);">
                <span class="material-symbols-outlined"
                    style="color: #facc15; font-size: 0.875rem; font-variation-settings: 'FILL' 1;">verified</span>
                <span style="font-size: 0.75rem; font-weight: 600; color: white;">Google Partner</span>
            </div>
        </div>
        <!-- Progress Indicator -->
        <div class="progress-indicator"
            style="display: flex; gap: 0.5rem; padding: 0.5rem 1rem; background: var(--background-dark);">
            <div class="progress-indicator__bar progress-indicator__bar--active" id="progress-1"></div>
            <div class="progress-indicator__bar" id="progress-2"></div>
            <div class="progress-indicator__bar" id="progress-3"></div>
        </div>
    </header>

    <!-- Mobile Container -->
    <div class="quiz-container" style="padding-top: 90px;">

        <!-- Question Counter -->
        <div class="question-counter">
            <span class="question-counter__current" id="current-question">1</span>
            <span class="question-counter__separator">/</span>
            <span class="question-counter__total" id="total-questions">3</span>
        </div>

        <!-- Scrollable Content Area -->
        <div class="quiz-content">
            <!-- Question Section -->
            <div class="quiz-header">
                <h2 class="quiz-header__question" id="question-text">
                    Loading question...
                </h2>
            </div>

            <!-- Options -->
            <div class="quiz-options" id="options-container">
                <!-- Options will be dynamically inserted here -->
            </div>

            <!-- Hint Box -->
            <div class="quiz-hint">
                <div class="quiz-hint__icon">
                    <span class="material-symbols-outlined filled">lightbulb</span>
                </div>
                <p class="quiz-hint__text">
                    No wrong answers here. This just helps us build the right course for you.
                </p>
            </div>
        </div>

        <!-- Sticky Footer -->
        <div class="quiz-footer">
            <button class="quiz-footer__button" id="next-btn" disabled>
                <span id="btn-text">Next Question</span>
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </div>

        <!-- Background Decorative Elements -->
        <div class="bg-decoration bg-decoration--top"></div>
        <div class="bg-decoration bg-decoration--bottom"></div>
    </div>

    <!-- JavaScript -->
    <script src="js/quiz.js"></script>
</body>

</html>
